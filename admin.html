<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .admin-section { 
            padding: 40px; 
            background: var(--glass-bg); 
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            margin: 100px auto 40px; 
            border-radius: var(--border-radius); 
            border: 1px solid var(--glass-border);
            max-width: 1000px;
            color: var(--white);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid var(--glass-border); padding: 12px; text-align: left; color: var(--white); }
        th { background: rgba(255,255,255,0.05); }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: var(--font-primary);
        }
        input[type="submit"] {
            background: var(--accent);
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition-smooth);
        }
        input[type="submit"]:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/" class="nav-branding">ArSiJa</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="admin-section">
        <h1>Admin Dashboard</h1>
        <p>Total Users: {{ total_users }} | Total Clicks: {{ total_clicks }}</p>
        
        <h2>Users (IP & Clicks)</h2>
        <table>
            <tr><th>IP</th><th>Clicks</th></tr>
            {% for user in users %}
            <tr><td>{{ user.ip }}</td><td>{{ user.clicks }}</td></tr>
            {% endfor %}
        </table>
    </div>

    <div class="admin-section">
        <h2>Add Project</h2>
        <form action="/admin/add_project" method="post">
            <input type="text" name="title" placeholder="Title" required><br>
            <input type="text" name="short_description" placeholder="Short Description"><br>
            <input type="text" name="image_url" placeholder="Image URL"><br>
            <textarea name="long_text" placeholder="Full Description (Markdown supported)"></textarea><br>
            <input type="submit" value="Add Project">
        </form>
    </div>

    <footer style="border-radius: 0%;">
        <div class="footer-copyright">
            <p>&copy; 2026 ArSiJa. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
